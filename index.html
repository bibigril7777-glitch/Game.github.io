<!DOCTYPE html><html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ភ្នំពេញ RPG</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,"Khmer OS",sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:6px;left:8px;font-size:14px;text-shadow:0 0 3px #000;pointer-events:none;line-height:1.5}
#tb{position:fixed;top:6px;right:8px;z-index:4;display:flex;gap:6px}
#tb button{padding:6px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:5}
.h{display:none}
button{font-size:16px;padding:10px 18px;border:0;border-radius:8px;background:#e8a317;color:#000;font-weight:700}
input{font-size:16px;padding:10px;border-radius:8px;border:0;text-align:center}
#tc{position:fixed;inset:50% 0 0 0;pointer-events:none;z-index:3}
#stick{position:absolute;left:20px;bottom:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
.b{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;opacity:.85;font-size:26px;padding:0}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div id="tb"><button id="sb">🛒</button><button id="ab">⚙</button></div>
<div id="tc"><div id="stick"><div id="knob"></div></div>
<button class="b" id="fb" style="right:20px;bottom:30px">🔫</button>
<button class="b" id="cb" style="right:100px;bottom:90px">🚗</button></div>
<div id="menu" class="ov"><h1>🇰🇭 ភ្នំពេញ RPG</h1><p>បញ្ចូលឈ្មោះ ហើយចាប់ផ្តើមលេង</p>
<input id="nm" maxlength="12" placeholder="ឈ្មោះ"><button id="go">▶ ចាប់ផ្តើម</button>
<small>WASD/ព្រួញ = ដើរ/បើកបរ · Space = បាញ់ · E = លួចឡាន/ចុះឡាន</small></div>
<div id="over" class="ov h"><h1>💀 អ្នកបរាជ័យ</h1><button onclick="G.start()">🔄 លេងឡើងវិញ</button></div>
<div id="shop" class="ov h"></div>
<script src="name.js"></script><script src="game.js"></script><script src="admin.js"></script>
</body></html>
